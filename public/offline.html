<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1f3d" />
    <title>Jumping Jax | Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #fff8e8;
        color: #0f172a;
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: #ffffff;
        border: 1px solid #dbe3ee;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgb(15 31 61 / 12%);
        max-width: 480px;
        padding: 40px;
        text-align: center;
        width: 100%;
      }
      .mark {
        align-items: center;
        background: #0f1f3d;
        border-radius: 22px;
        color: #22b8c7;
        display: inline-flex;
        font-size: 42px;
        font-weight: 900;
        height: 88px;
        justify-content: center;
        letter-spacing: -4px;
        margin-bottom: 24px;
        padding-right: 5px;
        width: 88px;
      }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { color: #475569; line-height: 1.6; margin: 0 0 26px; }
      button {
        background: #0f1f3d;
        border: 0;
        border-radius: 999px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        padding: 13px 24px;
      }
      button:focus-visible { outline: 3px solid #22b8c7; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">JX</div>
      <h1>You’re offline</h1>
      <p>Jumping Jax Operations needs an internet connection. No booking or customer information has been saved to this device.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
