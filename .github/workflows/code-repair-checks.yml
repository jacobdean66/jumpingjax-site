name: Code repair integration checks
on:
  pull_request:
    paths:
      - 'src/lib/agent-manager/**'
      - 'src/app/admin/agents/**'
      - 'src/app/api/**/code-repair*/**'
      - 'scripts/code-repairs/**'
      - 'supabase/migrations/*code_repairs.sql'
      - '.github/workflows/*repair*.yml'
  push:
    branches: ['codex/permanent-agent-code-repairs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit --incremental false
      - run: node --import tsx --test src/lib/agent-manager/code-repair.test.mts src/lib/agent-manager/code-repair-api.test.mts src/lib/agent-manager/coding-diagnosis.test.mts src/lib/agent-manager/supervisor.test.mts src/lib/agent-manager/supervisor-boundaries.test.mts src/app/admin/agents/agent-manager-ui.test.mts
      - run: node --test scripts/code-repairs/verify.test.mjs
      - run: node --conditions=react-server --import tsx --test src/lib/agent-manager/network/network.test.mts
